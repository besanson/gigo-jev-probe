[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gigo-jev-probe"
version = "0.1.0"
description = "Registered probe of TypeSafe AI's Jev model as an advisory data-quality critic on GIGO-Bench"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "httpx2", "typesafe-sdk==0.7.2", "anthropic==1.9.0"]
live = ["typesafe-sdk==0.7.2"]
live-v2 = ["typesafe-sdk==0.7.2", "anthropic==1.9.0"]

[tool.setuptools]
py-modules = ["preflight"]
packages = ["jev_probe"]
package-dir = { "jev_probe" = "src/jev_probe" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"
